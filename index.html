
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VELORA | بوتيكك الأنيق</title>
<style>
:root{--pink:#d77c9d;--dark:#492b3b;--bg:#fff8fb;--line:#f0dce5}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:white;padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:32px;letter-spacing:4px;color:var(--pink)}
header p{margin:9px 0 0}
main{max-width:900px;margin:auto;padding:18px}
h2{margin-top:26px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px}
.filter{background:white;border:1px solid var(--line);color:var(--dark)}
.filter.active,.primary{background:var(--pink);color:white}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:14px}
.pic{font-size:48px;text-align:center;background:#fff1f6;border-radius:12px;padding:18px 4px}
.card h3{font-size:16px;min-height:36px}
.price{font-weight:bold;color:var(--pink)}
.note{font-size:13px;color:#8d7180}
.add{background:var(--dark);color:white;width:100%;margin-top:12px}
.panel{margin-top:18px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-row button{padding:6px 10px;background:#faeaf1}
.total{font-size:20px;font-weight:bold;margin:18px 0}
label{display:block;margin-top:14px;margin-bottom:6px;font-weight:bold}
input,textarea{width:100%;padding:12px;border:1px solid #e4cbd7;border-radius:10px;font:inherit;background:white}
textarea{min-height:75px;resize:vertical}
.primary{width:100%;margin-top:18px}
footer{text-align:center;padding:24px;color:#8d7180;font-size:13px}
</style>
</head>
<body>
<header>
<h1>VELORA</h1>
<p>أناقتك تبدأ من هنا ♡</p>
<p>ملابس • إكسسوارات • رياضة</p>
</header>

<main>
<h2>تسوّقي مجموعتنا ✨</h2>
<div class="filters">
<button class="filter active" onclick="filterProducts('الكل',this)">الكل</button>
<button class="filter" onclick="filterProducts('ملابس',this)">ملابس</button>
<button class="filter" onclick="filterProducts('إكسسوارات',this)">إكسسوارات</button>
<button class="filter" onclick="filterProducts('رياضة',this)">رياضة</button>
</div>

<div id="products"></div>

<section class="panel">
<h2>🛍️ سلّتك</h2>
<div id="cart"><p class="note">السلة فارغة حاليًا.</p></div>
<div class="total">المجموع: <span id="total">0 دج</span></div>
</section>

<section class="panel">
<h2>إتمام الطلب 💗</h2>
<form id="orderForm">
<label for="customer">الاسم الكامل</label>
<input id="customer" required maxlength="100" placeholder="اكتبي اسمك">

<label for="phone">رقم الهاتف</label>
<input id="phone" required type="tel" maxlength="30" placeholder="05 / 06 / 07">

<label for="address">الولاية والبلدية</label>
<input id="address" required maxlength="200" placeholder="مكان التوصيل">

<label for="details">تفاصيل إضافية (المقاس، اللون...)</label>
<textarea id="details" maxlength="1000" placeholder="اكتبي التفاصيل إذا حبيتي"></textarea>

<label for="productImage">صورة المنتج (اختياري)</label>
<input id="productImage" type="file" accept="image/jpeg,image/png,image/webp">
<p class="note">الصيغ المقبولة JPG وPNG وWebP، بحجم أقصى 5 ميغابايت.</p>

<button class="primary" id="submitButton" type="submit">إرسال الطلب</button>
<p class="note">لن يُعتبر الطلب مرسلًا إلا بعد تأكيد نجاح التسجيل.</p>
</form>
</section>
</main>

<footer>VELORA ♡ أناقة بتفاصيلك</footer>

<script>
'use strict';

const SUPABASE_URL = 'https://rogrvbgbrafuyzzxwsjf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'ضعي_المفتاح_العام_هنا';sb_publishable_CdWiOyTti7pEh0Q4lvbpDQ_zI6_r-z2

const products = [
{id:1,name:'فستان أنيق',cat:'ملابس',,emoji:'👗'},
{id:2,name:'حقيبة نسائية',cat:'إكسسوارات',emoji:'👜'},
{id:3,name:'طقم رياضي',cat:'رياضة',,emoji:'🎽'},
{id:4,name:'إكسسوار ناعم',cat:'إكسسوارات',emoji:'🎀'},
{id:5,name:'بلوزة أنيقة',cat:'ملابس',emoji:'👚'},
{id:6,name:'حذاء رياضي',cat:'رياضة',emoji:'👟'}
];

let cart = {};
let category = 'الكل';

const money = n => n.toLocaleString('fr-DZ') + ' دج';

function renderProducts(){
  const list = products.filter(p => category === 'الكل' || p.cat === category);
  document.getElementById('products').innerHTML = list.map(p => `
    <article class="card">
      <div class="pic">${p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="price">${money(p.price)}</div>
      <p class="note">السعر تجريبي — يتأكد حسب الطلب</p>
      <button class="add" type="button" onclick="addToCart(${p.id})">أضيفي للسلة</button>
    </article>
  `).join('');
}

function filterProducts(cat, btn){
  category = cat;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQty(id, amount){
  cart[id] = (cart[id] || 0) + amount;
  if(cart[id] <= 0) delete cart[id];
  renderCart();
}

function renderCart(){
  const ids = Object.keys(cart);
  const box = document.getElementById('cart');

  if(!ids.length){
    box.innerHTML = '<p class="note">السلة فارغة حاليًا.</p>';
  } else {
    box.innerHTML = ids.map(id => {
      const p = products.find(x => x.id === Number(id));
      return `<div class="cart-row">
        <div>${p.name}<br><span class="note">${money(p.price)} × ${cart[id]}</span></div>
        <div>
          <button type="button" onclick="changeQty(${id},-1)">−</button>
          <span>${cart[id]}</span>
          <button type="button" onclick="changeQty(${id},1)">+</button>
        </div>
      </div>`;
    }).join('');
  }

  const total = ids.reduce((sum,id) => {
    const p = products.find(x => x.id === Number(id));
    return sum + p.price * cart[id];
  }, 0);

  document.getElementById('total').textContent = money(total);
}

document.getElementById('orderForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const ids = Object.keys(cart);
  if(!ids.length){
    alert('زيدي منتجًا واحدًا على الأقل للسلة أولًا.');
    return;
  }

  if(SUPABASE_PUBLISHABLE_KEY === 'ضعي_المفتاح_العام_هنا'){
    alert('لازم تضيفي المفتاح العام الصحيح قبل إرسال الطلب.');
    return;
  }

  const image = document.getElementById('productImage').files[0];

  if(image && !['image/jpeg','image/png','image/webp'].includes(image.type)){
    alert('اختاري صورة JPG أو PNG أو WebP.');
    return;
  }

  if(image && image.size > 5 * 1024 * 1024){
    alert('حجم الصورة لازم يكون 5 ميغابايت أو أقل.');
    return;
  }

  const items = ids.map(id => {
    const p = products.find(x => x.id === Number(id));
    return {
      id:p.id,
      name:p.name,
      quantity:cart[id],
      unit_price:p.price,
      total:p.price * cart[id]
    };
  });

  const form = new FormData();
  form.append('customer_name', document.getElementById('customer').value.trim());
  form.append('customer_phone', document.getElementById('phone').value.trim());
  form.append('customer_address', document.getElementById('address').value.trim());
  form.append('product_name', items.map(x => x.name).join('، '));
  form.append('product_details', document.getElementById('details').value.trim());
  form.append('items', JSON.stringify(items));
  if(image) form.append('image', image);

  const button = document.getElementById('submitButton');
  button.disabled = true;
  button.textContent = 'جارٍ إرسال الطلب...';

  try {
    const response = await fetch(`${SUPABASE_URL}/functions/v1/hyper-function`, {
      method:'POST',
      headers:{ apikey:SUPABASE_PUBLISHABLE_KEY },
      body:form
    });

    const result = await response.json().catch(() => ({}));

    if(!response.ok || result.success !== true){
      throw new Error(result.error || 'تعذر تأكيد تسجيل الطلب.');
    }

    alert('وصل طلبك بنجاح إلى VELORA 💗 رقم الطلب: ' + (result.order_id || result.id || 'تم التسجيل'));
    cart = {};
    renderCart();
    this.reset();
  } catch(error) {
    console.error('VELORA order error:', error);
    alert('ما قدرناش نأكدوا تسجيل الطلب. ' + error.message + ' حاولي لاحقًا.');
  } finally {
    button.disabled = false;
    button.textContent = 'إرسال الطلب';
  }
});

renderProducts();
renderCart();
</script>
</body>
</html>
